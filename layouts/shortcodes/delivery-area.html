{{- range hugo.Data.delivery.area.states }}
<h3 class="zip-state">{{ .name }}</h3>
{{- with .note }}
<p class="zip-note">{{ . }}</p>
{{- end }}
<table class="table table-sm zip-table">
  <colgroup>
    <col class="zip-col-town">
    <col>
  </colgroup>
  <thead>
    <tr>
      <th scope="col">Town</th>
      <th scope="col">ZIP codes</th>
    </tr>
  </thead>
  <tbody>
    {{- range .towns }}
    <tr>
      <th scope="row">{{ .town }}</th>
      <td>{{ delimit .zips ", " }}</td>
    </tr>
    {{- end }}
  </tbody>
</table>
{{- end }}
