{{/* The pickup picker while the lists load (#271, #573): the board's
     shape, a legend, the weeks' names and two places of two chips, in
     the picker's own grid, so the board lands where the bars were. */}}
<div class="pickup-picker-wait">
  <span class="placeholder col-4">Choose a pickup</span>
  {{ range seq 2 }}
    <div class="row">
      <div class="col-12 col-md-5">
        <span class="placeholder col-8">Place</span>
        <span class="placeholder col-6 mt-2">Days and hours</span>
      </div>
      <div class="col-12 col-md-7 mt-2 mt-md-0">
        <div class="row g-2">
          <div class="col"><span class="placeholder pickup-picker-wait-chip"></span></div>
          <div class="col"><span class="placeholder pickup-picker-wait-chip"></span></div>
        </div>
      </div>
    </div>
  {{ end }}
</div>
