{{/* What follows a pause, beside a video's play button: the offer to
     stop every video on the site playing on its own, then its answer.
     scripts/video/ shows it. Draft wording for James (#133). */}}
<p class="video-note" role="status" data-autoplay-note hidden>
  <span data-autoplay-offer><button class="video-note-btn" type="button" data-autoplay-off>Turn off autoplay</button></span>
  <span class="video-note-done" data-autoplay-done hidden>Videos here will wait for you to press play.</span>
</p>
