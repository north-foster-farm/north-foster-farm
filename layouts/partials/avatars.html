{{/* The chicken avatars a customer can choose from, as SVG symbols.
     Keys match data/avatars.json. Use with:
       <svg class="avatar"><use href="#avatar-hen-brown"/></svg> */}}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  {{ $birds := slice
    (dict "key" "hen-brown" "body" "#a0522d" "wing" "#7a3e22" "comb" "#e0443e" "beak" "#f2b134")
    (dict "key" "hen-black" "body" "#2b2b2b" "wing" "#111111" "comb" "#e0443e" "beak" "#f2b134")
    (dict "key" "hen-white" "body" "#f7f3ea" "wing" "#e0dacd" "comb" "#e0443e" "beak" "#f2b134")
    (dict "key" "hen-gold" "body" "#d9a441" "wing" "#b8862f" "comb" "#e0443e" "beak" "#f2b134")
  }}
  {{ range $birds }}
    <symbol id="avatar-{{ .key }}" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="32" fill="#e3efe7"/>
      <path d="M14 38c0-10 8-16 18-16h4c9 0 16 7 16 16v4c0 6-5 10-11 10H26c-7 0-12-5-12-12z" fill="{{ .body }}"/>
      <path d="M26 40c6-2 12-2 18 0-2 6-6 9-9 9s-7-3-9-9z" fill="{{ .wing }}"/>
      <path d="M38 22c0-6 4-11 10-11 3 0 5 2 5 5 0 5-3 9-8 10z" fill="{{ .body }}"/>
      <path d="M42 11c1-3 3-4 5-4 1 2 0 4-1 5-1-1-3-1-4-1zm5 0c2-2 4-2 6-1 0 2-2 4-4 4 0-1-1-2-2-3z" fill="{{ .comb }}"/>
      <path d="M52 17l7 2-7 3z" fill="{{ .beak }}"/>
      <path d="M48 24c2 0 3 2 3 4s-2 3-3 3-2-2-2-4 1-3 2-3z" fill="{{ .comb }}"/>
      <circle cx="47" cy="15" r="1.8" fill="#1d1c1b"/>
      <path d="M28 52l-2 6h4zm8 0l-2 6h4z" fill="{{ .beak }}"/>
    </symbol>
  {{ end }}
  <symbol id="avatar-rooster" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="32" fill="#e3efe7"/>
    <path d="M10 40c4-10 12-14 20-14h4c8 0 14 6 14 14v4c0 6-5 10-11 10H22c-7 0-12-5-12-12z" fill="#1e7b54"/>
    <path d="M6 30c2-8 6-14 12-16-1 6 0 11 4 16-6 2-11 2-16 0z" fill="#0f4d33"/>
    <path d="M24 42c6-2 12-2 18 0-2 6-6 9-9 9s-7-3-9-9z" fill="#0f4d33"/>
    <path d="M36 22c0-7 5-13 12-13 3 0 5 2 5 5 0 6-4 10-9 11z" fill="#a0522d"/>
    <path d="M40 9c1-4 3-6 6-6 1 2 0 4-1 6h-5zm5-1c2-3 5-4 7-2 0 3-2 5-4 5 0-1-1-2-3-3zm6 2c2-1 4 0 5 2-1 2-3 3-5 2 0-2 0-3 0-4z" fill="#e0443e"/>
    <path d="M52 16l8 2-8 3z" fill="#f2b134"/>
    <path d="M48 23c2 0 3 2 3 5s-2 4-3 4-3-2-3-5 1-4 3-4z" fill="#e0443e"/>
    <circle cx="47" cy="14" r="1.8" fill="#1d1c1b"/>
    <path d="M26 52l-2 7h4zm8 0l-2 7h4z" fill="#f2b134"/>
  </symbol>
  <symbol id="avatar-chick" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="32" fill="#e3efe7"/>
    <circle cx="32" cy="40" r="14" fill="#ffd94a"/>
    <circle cx="36" cy="24" r="11" fill="#ffe27a"/>
    <path d="M22 44c4-3 8-3 12 0-2 5-5 7-6 7s-4-2-6-7z" fill="#f2c23a"/>
    <path d="M46 24l7 2-7 3z" fill="#f2953c"/>
    <circle cx="40" cy="22" r="1.8" fill="#1d1c1b"/>
    <path d="M28 54l-2 6h4zm8 0l-2 6h4z" fill="#f2953c"/>
    <path d="M30 13c1-3 3-4 5-3-1 2-1 3 0 5-2-1-4-1-5-2z" fill="#ffe27a"/>
  </symbol>
</svg>
