{{/* The footer's links, from config/_default/menus.toml. */}}
<nav aria-label="Footer">
  <ul class="dot-list" data-dot-list>
  {{ $currentPage := . }}
  {{ range $menuItem := .Site.Menus.footer }}
    {{ partial "footer/menu-item.html" (dict
      "page" $currentPage
      "menuItem" $menuItem
      "menu" "footer"
    ) }}
  {{ end }}
  </ul>
</nav>
