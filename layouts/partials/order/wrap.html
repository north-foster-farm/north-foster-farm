<div class="order-hp" aria-hidden="true">
  <label for="order-website">Website</label>
  <input type="text" id="order-website" name="website" tabindex="-1" autocomplete="off">
</div>

<div class="order-submit">
  <div class="alert alert-danger" role="alert" data-form-error hidden></div>
  <button type="submit" class="btn btn-primary btn-lg" id="order-submit" disabled>Pay and place your order</button>
  <div class="order-pending" id="order-pending" role="status" aria-live="polite" hidden>
    <p class="order-pending-title" data-pending-title></p>
    <p class="order-pending-text" data-pending-text></p>
    <p class="order-pending-meta">
      <span data-pending-count></span>
      <span class="order-pending-countdown" data-pending-countdown aria-live="off"></span>
    </p>
    <div class="order-pending-actions">
      <button type="button" class="btn btn-sm btn-outline-primary" data-pending-retry>Try now</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-pending-cancel>Stop trying</button>
    </div>
  </div>
</div>
