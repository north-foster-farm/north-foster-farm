{{ $terms := hugo.Data.delivery }}
{{ $money := $terms.money }}
{{ $policy := relURL "delivery-policy/" }}
<fieldset class="order-section mb-5" id="pickup">
  <legend class="h2" tabindex="-1">Pickup or delivery</legend>
  <div class="invalid-feedback d-block mb-2" data-error-for="fulfilment.method"></div>
  <div class="order-methods" role="radiogroup" aria-label="How to get your order">

    <div class="order-method">
      <input class="form-check-input" type="radio" name="method" id="method-onfarm" value="onfarm" data-field="fulfilment.method" checked>
      <label class="order-method-label" for="method-onfarm">
        <span class="order-method-title">On-farm pickup</span>
        <dl class="order-method-facts">
          <dt>When</dt>
          <dd>By appointment only</dd>
          <dt>Where</dt>
          <dd>{{ $terms.onFarm.address }}</dd>
          <dt>Cost</dt>
          <dd>No minimum, no fee</dd>
        </dl>
      </label>
      <div class="order-method-reveal" data-method-body="onfarm" inert>
        <div class="order-method-body order-hform">
          <div class="row">
            <label class="col-sm-4 col-form-label" for="onfarm-date">Requested pick-up day</label>
            <div class="col-sm-8">
              <select class="form-select" id="onfarm-date" name="onfarm.date" data-dates="onfarm" data-field="fulfilment.date" disabled aria-describedby="err-onfarm-date">
                <option value="">Loading dates&hellip;</option>
              </select>
              <div class="invalid-feedback" id="err-onfarm-date" data-error-for="fulfilment.date"></div>
            </div>
          </div>
          <div class="row">
            <span class="col-sm-4 col-form-label" id="onfarm-window-label">Preferred window</span>
            <div class="col-sm-8">
              <div class="order-radios" role="radiogroup" aria-labelledby="onfarm-window-label" data-field="onfarm.window">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="onfarm.window" id="onfarm-morning" value="morning" checked>
                  <label class="form-check-label" for="onfarm-morning">Morning</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="onfarm.window" id="onfarm-afternoon" value="afternoon">
                  <label class="form-check-label" for="onfarm-afternoon">Afternoon</label>
                </div>
              </div>
              <div class="invalid-feedback" data-error-for="onfarm.window"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="order-method">
      <input class="form-check-input" type="radio" name="method" id="method-scituate" value="scituate" data-field="fulfilment.method">
      <label class="order-method-label" for="method-scituate">
        <span class="order-method-title">Scituate drop site</span>
        <dl class="order-method-facts">
          <dt>When</dt>
          <dd>Saturdays, {{ $terms.scituate.window }}, starting {{ dateFormat "January 2" $terms.scituate.start }}</dd>
          <dt>Where</dt>
          <dd>{{ $terms.scituate.location }}</dd>
          <dt>Cost</dt>
          <dd>No minimum, no fee</dd>
        </dl>
      </label>
      <div class="order-method-reveal" data-method-body="scituate" inert>
        <div class="order-method-body order-hform">
          <div class="row">
            <label class="col-sm-4 col-form-label" for="scituate-date">Choose a pick-up day</label>
            <div class="col-sm-8">
              <select class="form-select" id="scituate-date" name="scituate.date" data-dates="scituate" data-field="fulfilment.date" disabled aria-describedby="err-scituate-date">
                <option value="">Loading dates&hellip;</option>
              </select>
              <div class="invalid-feedback" id="err-scituate-date" data-error-for="fulfilment.date"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="order-method">
      <input class="form-check-input" type="radio" name="method" id="method-delivery" value="delivery" data-field="fulfilment.method">
      <label class="order-method-label" for="method-delivery">
        <span class="order-method-title">Delivery</span>
        <dl class="order-method-facts">
          <dt>When</dt>
          <dd>Thursdays, approximately {{ $terms.delivery.window }}</dd>
          <dt>Where</dt>
          <dd>Check <a href="{{ $policy }}#delivery-area" target="_blank" rel="noopener">our delivery area</a></dd>
          <dt>Cost</dt>
          <dd>${{ $money.deliveryMinimum }} minimum, ${{ $money.deliveryFee }} delivery fee</dd>
        </dl>
      </label>
      <div class="order-method-reveal" data-method-body="delivery" inert>
        <div class="order-method-body order-hform">
          <p class="zip-note order-countdown" data-countdown aria-live="off">
            <span data-countdown-text></span>
          </p>
          <p class="zip-note zip-note-warning order-agree" data-agree>
            <span>By placing a delivery order you agree to our <a href="{{ $policy }}" target="_blank" rel="noopener">delivery policy</a>.</span>
            <button type="button" class="btn-close order-agree-dismiss" aria-label="Dismiss" data-agree-dismiss></button>
          </p>
          <div class="invalid-feedback d-block mb-2" data-error-for="delivery.minimum"></div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-date">Delivery date</label>
            <div class="col-sm-8 col-lg-6">
              <select class="form-select" id="delivery-date" name="delivery.date" data-dates="delivery" data-field="fulfilment.date" disabled aria-describedby="err-delivery-date">
                <option value="">Loading dates&hellip;</option>
              </select>
              <div class="invalid-feedback" id="err-delivery-date" data-error-for="fulfilment.date"></div>
            </div>
          </div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-address1">Street address</label>
            <div class="col-sm-8">
              <input class="form-control" type="text" id="delivery-address1" name="delivery.address1" autocomplete="shipping address-line1" data-field="delivery.address1" aria-describedby="err-delivery-address1">
              <div class="invalid-feedback" id="err-delivery-address1" data-error-for="delivery.address1"></div>
            </div>
          </div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-address2">Apartment, unit, or floor <span class="text-body-secondary">(optional)</span></label>
            <div class="col-sm-8">
              <input class="form-control" type="text" id="delivery-address2" name="delivery.address2" autocomplete="shipping address-line2" data-field="delivery.address2">
            </div>
          </div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-town">City or town</label>
            <div class="col-sm-8">
              <input class="form-control" type="text" id="delivery-town" name="delivery.town" autocomplete="shipping address-level2" data-field="delivery.town" aria-describedby="err-delivery-town">
              <div class="invalid-feedback" id="err-delivery-town" data-error-for="delivery.town"></div>
            </div>
          </div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-zip">ZIP</label>
            <div class="col-sm-8 col-lg-4">
              <input class="form-control" type="text" id="delivery-zip" name="delivery.zip" autocomplete="shipping postal-code" inputmode="numeric" maxlength="10" data-field="delivery.zip" aria-describedby="help-delivery-zip err-delivery-zip">
              <div class="form-text" id="help-delivery-zip" data-zip-note></div>
              <div class="invalid-feedback" id="err-delivery-zip" data-error-for="delivery.zip"></div>
            </div>
          </div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-cooler">Where will we find your cooler?</label>
            <div class="col-sm-8">
              <textarea class="form-control" id="delivery-cooler" name="delivery.cooler" rows="2" data-field="delivery.cooler" aria-describedby="err-delivery-cooler"></textarea>
              <div class="invalid-feedback" id="err-delivery-cooler" data-error-for="delivery.cooler"></div>
            </div>
          </div>
          <div class="row">
            <label class="col-sm-4 col-form-label" for="delivery-notes">Other notes or instructions <span class="text-body-secondary">(optional)</span></label>
            <div class="col-sm-8">
              <textarea class="form-control" id="delivery-notes" name="delivery.notes" rows="2" data-field="delivery.notes"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</fieldset>
