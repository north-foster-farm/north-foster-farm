{{ $money := hugo.Data.delivery.money }}
<div class="order-summary" id="order-summary" aria-live="polite">
  <div class="order-summary-inner">
    <dl class="order-summary-lines mb-0">
      <div>
        <dt>Subtotal</dt>
        <dd data-total="subtotal">$0</dd>
      </div>
      <div data-total-row="discount" hidden>
        <dt>Bulk discount</dt>
        <dd data-total="discount">&minus;$0</dd>
      </div>
      <div data-total-row="fee" hidden>
        <dt>Delivery fee</dt>
        <dd data-total="fee">$0</dd>
      </div>
      <div class="order-summary-total">
        <dt>Total</dt>
        <dd data-total="total">$0</dd>
      </div>
    </dl>
    <p class="order-summary-nudge mb-0" data-nudge hidden></p>
  </div>
</div>
