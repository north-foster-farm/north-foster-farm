{{/* Horizontal layout: label column, field column. A signed-in
     customer's name, email and phone arrive as plain text; a click
     turns one into a field, and leaving it turns it back. */}}
<fieldset class="order-section mb-5" id="details">
  <legend class="h2" tabindex="-1">Your details</legend>
  <p class="order-section-hint">Click to edit</p>
  <div class="order-hform">
    <div class="row">
      <label class="col-sm-3 col-form-label" for="customer-name">Name</label>
      <div class="col-sm-9">
        <input class="form-control" type="text" id="customer-name" name="customer.name" autocomplete="name" required data-field="customer.name" data-prefill="name" aria-describedby="err-customer-name">
        <div class="invalid-feedback" id="err-customer-name" data-error-for="customer.name"></div>
      </div>
    </div>
    <div class="row">
      <label class="col-sm-3 col-form-label" for="customer-email">Email</label>
      <div class="col-sm-9">
        <input class="form-control" type="email" id="customer-email" name="customer.email" autocomplete="email" inputmode="email" required data-field="customer.email" data-prefill="email" aria-describedby="help-customer-email err-customer-email">
        <div class="form-text" id="help-customer-email">Your payment link will be sent to this address.</div>
        <div class="invalid-feedback" id="err-customer-email" data-error-for="customer.email"></div>
      </div>
    </div>
    <div class="row">
      <label class="col-sm-3 col-form-label" for="customer-phone">Phone</label>
      <div class="col-sm-9">
        <input class="form-control" type="tel" id="customer-phone" name="customer.phone" autocomplete="tel" inputmode="tel" required data-field="customer.phone" data-prefill="phone" aria-describedby="err-customer-phone">
        <div class="invalid-feedback" id="err-customer-phone" data-error-for="customer.phone"></div>
      </div>
    </div>
    <div class="row">
      <span class="col-sm-3 col-form-label" id="customer-contact-label">Prefer text or call?</span>
      <div class="col-sm-9">
        <div class="order-radios" role="radiogroup" aria-labelledby="customer-contact-label" data-field="customer.contact">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="customer.contact" id="contact-text" value="text">
            <label class="form-check-label" for="contact-text">Text</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="customer.contact" id="contact-call" value="call">
            <label class="form-check-label" for="contact-call">Call</label>
          </div>
        </div>
        <div class="invalid-feedback" data-error-for="customer.contact"></div>
      </div>
    </div>
  </div>
</fieldset>
