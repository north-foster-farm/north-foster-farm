[build]
publish = "public"
command = "yarn deploy && hugo --gc"

[build.environment]
HUGO_VERSION = "0.164.0"
NODE_VERSION = "26"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "yarn deploy && hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "yarn deploy && hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL"

[[redirects]]
  from = "/admin"
  to = "https://admin.northfosterfarm.com"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "https://admin.northfosterfarm.com"
  status = 301
  force = true

[[redirects]]
  from = "/venmo"
  to = "https://venmo.com/u/northfosterfarm"
  status = 301
  force = false

[[headers]]
  for = "/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    # HTML must never be cached for longer than a deploy takes to
    # matter. Netlify sends strong ETags, so this revalidates with a
    # cheap 304 rather than re-downloading the page.
    Cache-Control = '''
      public,
      max-age=0,
      must-revalidate
    '''
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = '''
      default-src 'none';
      base-uri 'self';
      connect-src 'self';
      font-src 'self';
      frame-ancestors 'none';
      img-src 'self' data:;
      manifest-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
    '''
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=86400; includeSubDomains"

# Hugo fingerprints these with a content hash, so the URL changes
# whenever the bytes do and they can be cached forever.
[[headers]]
  for = "/styles/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/scripts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not fingerprinted -- /images holds both Hugo-processed derivatives
# and pass-through originals -- so these get a long cache but stay
# revalidatable. A replacement propagates within a week.
[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicons/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
