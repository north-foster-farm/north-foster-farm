[build]
publish = "public"
command = "npm run deploy && hugo --gc && npm run check:grid"

[build.environment]
HUGO_VERSION = "0.164.0"
NODE_VERSION = "26"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "npm run deploy && hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL && npm run check:grid"

[context.branch-deploy]
command = "npm run deploy && hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL && npm run check:grid"

# The order form's API. Each function declares its own /api/* path.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# `netlify dev` runs the Hugo server and proxies the functions in
# front of it, so /api/* is exercisable locally.
[dev]
command = "bin/dev"
targetPort = 1313
port = 8888
publish = "public"
framework = "#custom"

# One order, deep-linked from the emails about it. The account page
# reads the id off the path; the session decides whose order it is.
[[redirects]]
  from = "/account/orders/*"
  to = "/account/"
  status = 200

# Browsers, feed readers and link previews ask for these at the root
# whatever the page says; the set lives in /favicons/.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicons/favicon.ico"
  status = 200

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/favicons/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/favicons/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/admin"
  to = "https://admin.northfosterfarm.com"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "https://admin.northfosterfarm.com"
  status = 301
  force = true

[[redirects]]
  from = "/venmo"
  to = "https://venmo.com/u/northfosterfarm"
  status = 301
  force = false

# The paper order form, retired when ordering moved onto the site. Its
# URL was handed out directly, so it leads to the order page.
[[redirects]]
  from = "/order-form.pdf"
  to = "/order/"
  status = 301
  force = false

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301
  force = false

[[redirects]]
  from = "/local-delivery-policy"
  to = "/delivery-policy"
  status = 301
  force = false

[[headers]]
  for = "/*"

  [headers.values]
    # HTML must never be cached for longer than a deploy takes to
    # matter. Netlify sends strong ETags, so this revalidates with a
    # cheap 304 rather than re-downloading the page.
    Cache-Control = '''
      public,
      max-age=0,
      must-revalidate
    '''
    X-Content-Type-Options = "nosniff"
    # The payment SDKs on the order page need their vendors' hosts:
    # Square's Web Payments SDK (sandbox and production; the card
    # fields are an iframe, and Square wants 'unsafe-inline' styles),
    # Google Pay and Cash App Pay through it, and PayPal's SDK for the
    # Venmo button. Netlify does not say how two header rules for one
    # path merge, so one policy covers every page.
    Content-Security-Policy = '''
      default-src 'none';
      base-uri 'self';
      connect-src 'self'
        https://web.squarecdn.com https://sandbox.web.squarecdn.com
        https://pci-connect.squareup.com
        https://pci-connect.squareupsandbox.com
        https://o160250.ingest.sentry.io
        https://google.com/pay https://pay.google.com
        https://api.cash.app https://sandbox.api.cash.app
        https://*.paypal.com https://*.paypalobjects.com
        https://*.venmo.com;
      font-src 'self' data:
        https://square-fonts-production-f.squarecdn.com
        https://d1g145x70srn7h.cloudfront.net
        https://cash-f.squarecdn.com https://fonts.gstatic.com;
      form-action 'self';
      frame-ancestors 'none';
      frame-src https://www.youtube-nocookie.com
        https://web.squarecdn.com https://sandbox.web.squarecdn.com
        https://pay.google.com
        https://kit.cash.app https://sandbox.kit.cash.app
        https://*.paypal.com https://*.paypalobjects.com
        https://*.venmo.com;
      img-src 'self' data:
        https://web.squarecdn.com https://sandbox.web.squarecdn.com
        https://api.cash.app https://sandbox.api.cash.app
        https://www.gstatic.com
        https://franklin-assets.s3.amazonaws.com
        https://*.paypal.com https://*.paypalobjects.com
        https://*.venmo.com;
      manifest-src 'self';
      media-src 'self';
      script-src 'self'
        https://web.squarecdn.com https://sandbox.web.squarecdn.com
        https://pay.google.com
        https://kit.cash.app https://sandbox.kit.cash.app
        https://*.paypal.com https://*.paypalobjects.com
        https://*.venmo.com;
      style-src 'self' 'unsafe-inline'
        https://web.squarecdn.com https://sandbox.web.squarecdn.com
        https://kit.cash.app https://sandbox.kit.cash.app
        https://fonts.googleapis.com
        https://*.paypal.com https://*.paypalobjects.com;
    '''
    # Google Pay opens a popup; the stricter value breaks it on iOS.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# API answers are computed per request and must never be cached.
[[headers]]
  for = "/api/*"

  [headers.values]
    Cache-Control = "no-store"

# Hugo fingerprints these with a content hash, so the URL changes
# whenever the bytes do and they can be cached forever.
[[headers]]
  for = "/styles/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/scripts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not fingerprinted -- /images holds both Hugo-processed derivatives
# and pass-through originals -- so these get a long cache but stay
# revalidatable. A replacement propagates within a week.
[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
    # The emails load Aller from here, so mail clients need CORS.
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/videos/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicons/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

# Netlify serves .webmanifest as application/octet-stream by default.
[[headers]]
  for = "/favicons/site.webmanifest"

  [headers.values]
    Content-Type = "application/manifest+json"
