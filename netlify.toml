[build]
publish = "public"
command = "npm run deploy && hugo --gc"

[build.environment]
HUGO_VERSION = "0.164.0"
NODE_VERSION = "26"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "npm run deploy && hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "npm run deploy && hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL"

# The order form's API. Each function declares its own /api/* path.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# `netlify dev` runs the Hugo server and proxies the functions in
# front of it, so /api/* is exercisable locally.
[dev]
command = "bin/dev"
targetPort = 1313
port = 8888
publish = "public"
framework = "#custom"

# One order, deep-linked from the emails about it. The account page
# reads the id off the path; the session decides whose order it is.
[[redirects]]
  from = "/account/orders/*"
  to = "/account/"
  status = 200

[[redirects]]
  from = "/admin"
  to = "https://admin.northfosterfarm.com"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "https://admin.northfosterfarm.com"
  status = 301
  force = true

[[redirects]]
  from = "/venmo"
  to = "https://venmo.com/u/northfosterfarm"
  status = 301
  force = false

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301
  force = false

[[redirects]]
  from = "/local-delivery-policy"
  to = "/delivery-policy"
  status = 301
  force = false

[[headers]]
  for = "/*"

  [headers.values]
    # HTML must never be cached for longer than a deploy takes to
    # matter. Netlify sends strong ETags, so this revalidates with a
    # cheap 304 rather than re-downloading the page.
    Cache-Control = '''
      public,
      max-age=0,
      must-revalidate
    '''
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = '''
      default-src 'none';
      base-uri 'self';
      connect-src 'self';
      font-src 'self';
      form-action 'self';
      frame-ancestors 'none';
      frame-src https://www.youtube-nocookie.com;
      img-src 'self' data:;
      manifest-src 'self';
      script-src 'self';
      style-src 'self';
    '''
    Referrer-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# API answers are computed per request and must never be cached.
[[headers]]
  for = "/api/*"

  [headers.values]
    Cache-Control = "no-store"

# Hugo fingerprints these with a content hash, so the URL changes
# whenever the bytes do and they can be cached forever.
[[headers]]
  for = "/styles/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/scripts/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not fingerprinted -- /images holds both Hugo-processed derivatives
# and pass-through originals -- so these get a long cache but stay
# revalidatable. A replacement propagates within a week.
[[headers]]
  for = "/fonts/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
    # The emails load Aller from here, so mail clients need CORS.
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/images/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicons/*"

  [headers.values]
    Cache-Control = "public, max-age=604800"
