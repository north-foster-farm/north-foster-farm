[build]
publish = "public"
command = "npm run check:env && npm run check:schedule && bin/prod && HUGO_BUILD_SHA=$COMMIT_REF hugo --gc && npm run build:orphans && npm run check:grid && npm run check:news"

[build.environment]
HUGO_VERSION = "0.164.0"
NODE_VERSION = "26.12.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
command = "npm run check:env && npm run check:schedule && node bin/install-gate.mjs && bin/prod && HUGO_BUILD_SHA=$COMMIT_REF hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL && npm run build:orphans && npm run check:grid && npm run check:news"

[context.branch-deploy]
command = "npm run check:env && npm run check:schedule && node bin/install-gate.mjs && bin/prod && HUGO_BUILD_SHA=$COMMIT_REF hugo --gc --buildDrafts --buildExpired --buildFuture -b $DEPLOY_PRIME_URL && npm run build:orphans && npm run check:grid && npm run check:news"

# After the build, before the upload: the source maps go into Blobs,
# out of the site (#246; docs/monitoring.md, "Source maps").
[[plugins]]
package = "./plugins/source-maps"

# The order form's API. Each function declares its own /api/* path.
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
# The jobs read the rotation log to remind the developer what is due
# (netlify/functions/lib/rotation.mjs); a missing file is tolerated.
included_files = ["docs/rotation-log.md"]

# `netlify dev` runs the Hugo server and proxies the functions in
# front of it, so /api/* is exercisable locally.
# `npm run start:functions` overrides targetPort with a free port and
# passes it to bin/dev as HUGO_PORT, so several can run at once (#276).
[dev]
command = "bin/dev"
targetPort = 1313
port = 8888
publish = "public"
framework = "#custom"

# One order, deep-linked from the emails about it. The account page
# reads the id off the path; the session decides whose order it is.
[[redirects]]
  from = "/account/orders/*"
  to = "/account/"
  status = 200

# Browsers, feed readers and link previews ask for these at the root
# whatever the page says; the set lives in /favicons/.
[[redirects]]
