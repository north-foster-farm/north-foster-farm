copyright = 2024
disableKinds = ["rss", "taxonomy", "term"]
enableEmoji = true
enableRobotsTXT = true
locale = "en-us"
pluralizeListTitles = true
relativeURLs = true
timeZone = "America/New_York"

[build]
  noJSConfigInAssets = true

  [build.buildStats]
    enable = true

[imaging]
  [imaging.avif]
    quality = 85

  [imaging.jpeg]
    quality = 85

  [imaging.webp]
    quality = 85

  [imaging.exif]
    disableDate = true
    disableLatLong = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.164.0"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"

[pagination]
  pagerSize = 10

# The staging toolbar partial reads Netlify's CONTEXT to keep itself
# out of production builds. Hugo lets templates read only the
# variables named here.
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^CONTEXT$']

[params]
  logo = "logo-vertical.svg"
  slogan = "Pasture-raised chicken and eggs in Foster, Rhode Island"

  [params.features]
    # Sign-in and the account pages: the Sign in link in the header,
    # and /login/ and /account/ in the build. On since 2026-09-22, so a
    # customer can pick a new pickup time or find an order themselves.
    # The functions also need ACCOUNTS_ENABLED=true on Netlify before
    # any email links to the pages. See docs/order-form.md, "Account".
    accounts = true

  [params.defaults]
    [params.defaults.featuredImage]
      [params.defaults.featuredImage.default]
        path = "share-card.png"

      [params.defaults.featuredImage.linkToOriginal]
        list = true
        section = true
        single = true

[sitemap]
  changefreq = "weekly"
