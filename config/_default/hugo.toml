copyright = 2024
disableKinds = ["rss", "taxonomy", "term"]
enableEmoji = true
enableRobotsTXT = true
locale = "en-us"
pluralizeListTitles = true
relativeURLs = true
timeZone = "America/New_York"

[build]
  noJSConfigInAssets = true

  [build.buildStats]
    enable = true

[imaging]
  [imaging.avif]
    quality = 85

  [imaging.jpeg]
    quality = 85

  [imaging.webp]
    quality = 85

  [imaging.exif]
    disableDate = true
    disableLatLong = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.164.0"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"

[pagination]
  pagerSize = 10

[params]
  logo = "logo-vertical.svg"
  slogan = "Pasture-raised eggs"

  [params.features]
    # Sign-in and the account pages: the header slot and the pages.
    accounts = true

  [params.defaults]
    [params.defaults.featuredImage]
      [params.defaults.featuredImage.default]
        path = "default-featured-image.png"

      [params.defaults.featuredImage.linkToOriginal]
        list = true
        section = true
        single = true

[sitemap]
  changefreq = "weekly"
