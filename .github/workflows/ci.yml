name: CI

# Lint and the unit tests, on every pull request, every push to the
# branches that matter and on demand. The check is named lint-and-test:
# lgtm-automerge waits on it, and branch protection on staging and main
# requires it, so a fast-forward to a SHA that never passed is refused.
#
# The run holds no secret. Each step runs under env -i, which drops
# every runner variable (GITHUB_TOKEN included), checkout leaves no
# token in .git/config, and test/setup.mjs keeps an allowlist of
# variables and closes the network for the suite.

on:
  pull_request:
  push:
    branches: [next, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: env -i PATH="$PATH" HOME="$HOME" npm run lint

      # A pull request checks its own commits; a push checks the commits
      # it added (a release to main: everything in it). A dispatched run
      # has no base and checks against origin/main. Only a pull request
      # and a push to main fail; next and staging get a warning.
      - name: Record shape
        run: >
          env -i PATH="$PATH" HOME="$HOME"
          node bin/check-record-shape.mjs
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          --event "${{ github.event_name }}"
          --ref "${{ github.ref }}"

      - name: Test
        run: env -i PATH="$PATH" HOME="$HOME" npm test
