name: Staging jobs

# Netlify runs scheduled functions only on the production deploy, so
# staging's jobs would never run on their own. This asks GitHub to run
# them every fifteen minutes through /api/staging/jobs/run, which is
# runJobs on Netlify with the staging deploy's own environment (404 in
# production). GitHub starts scheduled runs only from the default
# branch and throttles them under load, worst on the quarter hour, so
# the cron sits off it. Even so, runs have come two to six hours
# apart (#164): a job whose window closes at midnight (the delivery
# reminder, tomorrow's manifest) is skipped on a day with no evening
# run, and Run workflow starts one by hand. The jobs decide from the
# records and the clock, so a late or doubled run sends nothing twice.
# STAGING_TOKEN is the same token Netlify holds for staging.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run staging's jobs
        env:
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 120 \
            -X POST -H "Authorization: Bearer $STAGING_TOKEN" \
            -H "Content-Type: application/json" -d '{}' \
            https://staging--north-foster-farm.netlify.app/api/staging/jobs/run
