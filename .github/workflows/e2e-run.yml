name: E2E run

# One run of the Playwright suite, split across shards, each against
# its own local build: bin/e2e/serve.mjs builds the site as staging
# does and serves it with the functions offline and fake payments.
# Nothing depends on the Mac, on staging or on a vendor account. The
# staging-only specs (the access gate) are left out by
# playwright.config.mjs when the target is local.
#
# Called by e2e.yml, e2e-burn-in.yml and e2e-soak.yml, which name the
# check. Retries are always off. With passes: 2, each shard runs its
# share of the suite twice and fails if either pass fails: a pass and
# a fail on one commit is a flake, and it fails the check rather than
# being retried away (James, #283).
#
# The log is public. It prints test titles and results, no records:
# every order, account and message is made up by the specs, and the
# back-office token is random per run and dies with it.

on:
  workflow_call:
    inputs:
      args:
        description: More Playwright arguments
        type: string
        default: ""
      passes:
        type: number
        default: 2
      shards:
        description: The shard numbers, as a JSON list
        type: string
        default: "[1, 2, 3, 4, 5, 6]"
      total:
        type: number
        default: 6
      workers:
        type: number
        default: 2
      # A burn-in of the keyboard walk alone runs for hours: WebKit
      # takes minutes per walk, ten times over.
      timeout:
        description: Minutes a shard may run
        type: number
        default: 90

permissions:
  contents: read

jobs:
  shard:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      NETLIFY_CLI_VERSION: 26.1.0
      E2E_PORT: 8895
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - uses: ./.github/actions/setup-hugo

      # Pinned, not whatever npx would fetch.
      - name: Install the Netlify CLI
        run: npm install --global "netlify-cli@$NETLIFY_CLI_VERSION"

      - name: Playwright version
        id: playwright
        run: >
          echo "version=$(npx playwright --version | cut -d' ' -f2)"
          >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browsers come from the cache when it has them; the system
      # libraries they need are installed either way.
      - name: Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Back-office token
        run: |
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "E2E_STAGING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Serve the site
        run: |
          npm run e2e:serve -- --port "$E2E_PORT" \
            > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 180); do
            if curl -fs -o /dev/null "http://localhost:$E2E_PORT/api/dates"
            then exit 0; fi
            sleep 1
          done
          tail -n 40 "$RUNNER_TEMP/serve.log"
          exit 1

      - name: Run
        env:
          E2E_BASE_URL: http://localhost:${{ env.E2E_PORT }}
          PASSES: ${{ inputs.passes }}
          ARGS: ${{ inputs.args }}
          SHARD: ${{ matrix.shard }}/${{ inputs.total }}
          WORKERS: ${{ inputs.workers }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          failed=0
          for pass in $(seq 1 "$PASSES"); do
            echo "::group::Pass $pass of $PASSES, shard $SHARD"
            # shellcheck disable=SC2086
            if PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/pass-$pass" \
              npx playwright test --retries=0 --workers="$WORKERS" \
              --shard="$SHARD" --reporter=list,html $ARGS
            then result=passed; else result=failed; failed=$((failed + 1))
            fi
            echo "::endgroup::"
            echo "Pass $pass: $result"
          done
          if [ "$failed" -eq 0 ]; then exit 0; fi
          if [ "$failed" -lt "$PASSES" ]; then
            echo "::error title=e2e flake::A pass and a fail on one" \
              "commit. The flaky test fails the check; fix it or remove it."
          fi
          exit 1

      - name: Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
