name: Claude

# Dispatches a lane to Claude Code in the cloud (#349): a comment that
# says @claude, or a new issue that does, starts one run on a GitHub
# runner, off James's Mac. The run follows docs/cloud-lanes.md, works on
# a lane/cloud-<issue> branch and reports in a comment.
#
# Only James starts a run. The repository is public, so the job's `if`
# checks the author of the comment or issue, and the person who caused
# the event, against jbboynton (the bullpen's agents post as that login
# too). Any other user's event skips the job: no runner time, no plan
# spent, no token minted. The action then checks again that the actor
# has write access, and include_comments_by_actor keeps everyone else's
# comments out of what Claude reads, so a stranger's text on an issue
# cannot steer a run James starts.
#
# The one secret is CLAUDE_CODE_OAUTH_TOKEN. The action trades the run's
# OIDC token for a short-lived token of the Claude GitHub app, scoped to
# this repository, which is why id-token is granted. Checkout leaves no
# credentials in .git/config. The tool allowlist has no `git push`, and
# the action's own git-push.sh wrapper, which it adds when commit
# signing is off, is denied by name. The last step of the job, which
# the model does not control, pushes HEAD to lane/cloud-<issue> and
# nothing else. That step cannot reach next, staging or main.
#
# What the workflow cannot enforce: the deny rules on Write and Edit
# keep the run out of .github/ and .git/, but they are the action's
# tool rules, not a filesystem boundary. The push step therefore turns
# off git hooks and takes the branch name from the event, not from
# anything the run wrote.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    name: claude
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    if: >-
      (
        github.event_name == 'issue_comment'
        && github.event.issue.user.login == 'jbboynton'
        && github.event.comment.user.login == 'jbboynton'
        && github.actor == 'jbboynton'
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'issues'
        && github.event.issue.user.login == 'jbboynton'
        && github.actor == 'jbboynton'
        && (
          contains(github.event.issue.body, '@claude')
          || contains(github.event.issue.title, '@claude')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per issue or pull request. A later comment waits for the
    # run in progress instead of cancelling it. The group is on the job,
    # so a comment that skips the job never touches it.
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Hugo extended 0.164.0 and Dart Sass 1.79.5, as netlify.toml and
      # bin/prod use them, each checked against a pinned SHA-256.
      - uses: ./.github/actions/setup-hugo

      - uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: jbboynton
          base_branch: next
          branch_name_template: lane/cloud-{{entityNumber}}
          claude_args: |
            --max-turns 200
            --model claude-opus-5-5
            --append-system-prompt "You are a cloud lane of the North Foster Farm bullpen. Read docs/cloud-lanes.md first and follow it for the whole run. Work only on the issue or pull request that started this run. Commit on the lane/cloud-<issue> branch; the workflow pushes it after you finish, so never run git push. Never merge into or deploy next, staging or main, and never touch workflows, secrets or settings."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git fetch origin),Bash(git checkout:*),Bash(git switch:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git rebase origin/next),Bash(npm run lint:*),Bash(npm test),Bash(npm run check:*),Bash(hugo:*),Bash(node bin/audit/check.mjs:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh search issues:*)"
            --disallowedTools "Bash(*git-push.sh*),Write(.github/**),Edit(.github/**),Write(.git/**),Edit(.git/**)"

      # The only push of the run. The model has no push rule, and this
      # step names the one ref it may update. It runs even when the
      # action fails, so work already committed is not lost. Hooks are
      # off so nothing the run wrote under .git/ executes here.
      #
      # It pushes only when the run added work. The reference point is
      # the lane branch as it stands on origin (the tip), or origin/next
      # when the lane does not exist yet. `git cherry A B` marks with +
      # each commit of B whose change is not in A, so:
      #   - new work:  cherry tip HEAD shows a +  (HEAD has something
      #     the lane lacks);
      #   - nothing lost:  every commit on the lane that HEAD lacks by
      #     patch (cherry HEAD tip shows a +) is still kept, in one of
      #     two ways. A commit in origin/next..HEAD with the same author
      #     name, email, date and subject, used for at most one lane
      #     commit, was rebased, amended or conflict-resolved, which
      #     changes its patch-id (context lines count) but not those.
      #     Failing that, merging the lane into HEAD must change nothing
      #     (git merge-tree gives HEAD's own tree), which holds when the
      #     lane landed on next by squash. A review run, or a run that
      #     branched from next and never saw the lane, keeps neither,
      #     so it is refused.
      # A run that committed nothing, or checked out next for a review,
      # has no new work and leaves the lane alone (#533: a review run
      # replaced a lane's work). A run whose HEAD would drop commits
      # already on the lane fails loudly instead of pushing, and saves
      # the run's commits as a bundle that the next step uploads. The lease
      # on the fetched tip stops a push over a lane that moved during
      # the run.
      - name: Push the lane branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          case "$ISSUE" in ''|*[!0-9]*) echo "bad issue number"; exit 1;; esac
          branch="lane/cloud-$ISSUE"
          # A directory this step makes, so the upload below can only
          # see files this step wrote, never a path the run planted.
          out="$RUNNER_TEMP/lane-bundles"
          rm -rf "$out"
          mkdir "$out"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_push() {
            git -c core.hooksPath=/dev/null \
              -c "http.extraheader=AUTHORIZATION: basic $auth" "$@"
          }
          # Count the commits of $1's cherry output marked +. The output
          # is captured by plain assignment before this runs, so a
          # failed `git cherry` stops the step under `set -e` instead
          # of reading as a count of 0 (there is no pipefail).
          pluses() {
            printf '%s\n' "$1" | grep -c '^+' || true
          }
          url="https://github.com/$REPO"
          tipref="refs/remotes/lane/$branch"
          if git_push fetch "$url" "+refs/heads/$branch:$tipref"; then
            tip="$tipref"
            lease="--force-with-lease=refs/heads/$branch:$tipref"
          else
            tip="origin/next"
            lease=""
          fi
          added="$(git cherry "$tip" HEAD origin/next)"
          if [ "$(pluses "$added")" = "0" ]; then
            echo "No new commits past $tip; no push."
            exit 0
          fi
          if [ "$tip" != "origin/next" ]; then
            dropped="$(git cherry HEAD "$tip" origin/next)"
            if [ "$(pluses "$dropped")" != "0" ]; then
              fmt="%an%x01%ae%x01%at%x01%s"
              kept="$(git log --format="$fmt" origin/next..HEAD)"
              lost=0
              for sha in $(printf '%s\n' "$dropped" | sed -n 's/^+ //p'); do
                key="$(git log -1 --format="$fmt" "$sha")"
                hit="$(printf '%s\n' "$kept" | grep -nxF -m1 -- "$key" || true)"
                if [ -z "$hit" ]; then
                  lost=1
                else
                  kept="$(printf '%s\n' "$kept" | sed "${hit%%:*}d")"
                fi
              done
              if [ "$lost" = "1" ]; then
                merged="$(git merge-tree --write-tree HEAD "$tip" || true)"
                if [ "$(printf '%s\n' "$merged" | sed -n 1p)" \
                  != "$(git rev-parse HEAD^{tree})" ]; then
                  echo "HEAD drops commits already on $branch; not pushing."
                  git bundle create "$out/lane-work.bundle" \
                    origin/next..HEAD
                  exit 1
                fi
              fi
            fi
          fi
          # A push that replaces a tip HEAD does not contain would leave
          # the lane's commits on no ref. Keep them, and say where the
          # lane was, whatever check let the push through.
          if [ "$tip" != "origin/next" ] \
            && ! git merge-base --is-ancestor "$tip" HEAD; then
            echo "Replacing $branch, which was at $(git rev-parse "$tip")."
            git bundle create "$out/lane-replaced.bundle" origin/next.."$tip"
          fi
          git_push push --no-verify $lease "$url" "HEAD:refs/heads/$branch"

      # What the push step set aside: lane-work.bundle holds a refused
      # run's commits, lane-replaced.bundle the lane as it stood before
      # a push replaced it. `git fetch <bundle> HEAD` (lane-work) or
      # `git fetch <bundle> refs/remotes/lane/lane/cloud-<issue>`
      # (lane-replaced) brings them back.
      - name: Keep the set-aside work
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-work
          path: ${{ runner.temp }}/lane-bundles
          if-no-files-found: ignore
          retention-days: 14
