name: Claude

# Dispatches a lane to Claude Code in the cloud (#349): a comment that
# says @claude, or a new issue that does, starts one run on a GitHub
# runner, off James's Mac. The run follows docs/cloud-lanes.md, works on
# a lane/cloud-<issue> branch and reports in a comment.
#
# Only James starts a run. The repository is public, so the job's `if`
# checks the author of the comment or issue, and the person who caused
# the event, against jbboynton (the bullpen's agents post as that login
# too). Any other user's event skips the job: no runner time, no plan
# spent, no token minted. The action then checks again that the actor
# has write access, and include_comments_by_actor keeps everyone else's
# comments out of what Claude reads, so a stranger's text on an issue
# cannot steer a run James starts.
#
# The one secret is CLAUDE_CODE_OAUTH_TOKEN. The action trades the run's
# OIDC token for a short-lived token of the Claude GitHub app, scoped to
# this repository, which is why id-token is granted. Checkout leaves no
# credentials in .git/config. The tool allowlist below lets the run push
# only lane/cloud-* branches; it can never push next, staging or main.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    name: claude
    if: >-
      (
        github.event_name == 'issue_comment'
        && github.event.comment.user.login == 'jbboynton'
        && github.actor == 'jbboynton'
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'issues'
        && github.event.issue.user.login == 'jbboynton'
        && github.actor == 'jbboynton'
        && (
          contains(github.event.issue.body, '@claude')
          || contains(github.event.issue.title, '@claude')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per issue or pull request. A later comment waits for the
    # run in progress instead of cancelling it. The group is on the job,
    # so a comment that skips the job never touches it.
    concurrency:
      group: claude-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Hugo extended 0.164.0 and Dart Sass 1.79.5, as netlify.toml and
      # bin/prod use them, each checked against a pinned SHA-256.
      - uses: ./.github/actions/setup-hugo

      - uses: anthropics/claude-code-action@1b705f16976f0aa709c1c2e313dced92a66dbde5 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: jbboynton
          branch_name_template: lane/cloud-{{entityNumber}}
          claude_args: |
            --max-turns 200
            --append-system-prompt "You are a cloud lane of the North Foster Farm bullpen. Read docs/cloud-lanes.md first and follow it for the whole run. Work only on the issue or pull request that started this run. Push only a lane/cloud-<issue> branch. Never push, merge into or deploy next, staging or main, and never touch workflows, secrets or settings."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git rebase origin/next),Bash(git push origin HEAD:lane/cloud-*),Bash(git push --force-with-lease origin HEAD:lane/cloud-*),Bash(npm run lint:*),Bash(npm test),Bash(npm run check:*),Bash(hugo:*),Bash(node bin/audit/check.mjs:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh search issues:*)"
