name: Set up Playwright browsers
description: >
  The named Playwright browsers, for a job that runs in Microsoft's
  Playwright image (#556), which carries the browsers and every system
  library they need. The runners could not reach any Ubuntu apt mirror
  on 2026-11-11, so `install --with-deps` hung for the whole job. The
  install here finds the image's browsers and downloads only on a
  version mismatch (the image tag and @playwright/test have drifted;
  test/workflows.test.mjs catches that). A browser that still will not
  launch gets `install-deps` from apt, under a time limit with one
  retry. That fallback is for a hosted runner with no image.

inputs:
  browsers:
    description: Space-separated browser names
    required: true

runs:
  using: composite
  steps:
    - name: Browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # shellcheck disable=SC2086
        timeout --kill-after=15s 5m npx playwright install $BROWSERS

    # Launch each browser. In the image this always passes and apt is
    # never called.
    - name: Check the browsers launch
      id: launch
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        missing=0
        for b in $BROWSERS; do
          js="require('@playwright/test')['$b'].launch()"
          if node -e "$js.then(x => x.close())" \
            > "$RUNNER_TEMP/launch-$b.log" 2>&1
          then echo "$b launches"
          else echo "$b needs system libraries"; missing=1; fi
        done
        echo "missing=$missing" >> "$GITHUB_OUTPUT"

    - name: System libraries
      if: steps.launch.outputs.missing == '1'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # The image runs as root and has no sudo.
        SUDO=; [ "$(id -u)" -eq 0 ] || SUDO=sudo
        printf '%s\n' 'Acquire::http::Timeout "15";' \
          'Acquire::https::Timeout "15";' 'Acquire::Retries "1";' \
          | $SUDO tee /etc/apt/apt.conf.d/99-fail-fast > /dev/null
        for attempt in 1 2; do
          # shellcheck disable=SC2086
          if timeout --kill-after=15s 4m \
            npx playwright install-deps $BROWSERS
          then exit 0; fi
          echo "::warning title=apt::attempt $attempt failed or timed out"
        done
        echo "::error title=apt::the system libraries failed twice"
        exit 1
